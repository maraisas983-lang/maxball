services:
  - type: web
    name: maxball
    runtime: node
    branch: develop/maxball
    plan: starter
    region: ohio
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /opt/render/project/src/var/maxball.sqlite
      - key: AUTH_PROVIDER
        value: supabase
      - key: ADMIN_EMAILS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
    disk:
      name: maxball-data
      mountPath: /opt/render/project/src/var
      sizeGB: 1
