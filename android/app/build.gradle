plugins { id 'com.android.application' }
def defaultServer = new groovy.json.JsonSlurper().parse(file('../server.json')).url
def offlineBuild = providers.gradleProperty('MAXBALL_OFFLINE').orElse(providers.environmentVariable('MAXBALL_OFFLINE')).orElse('0').get() == '1'
def gameServer = offlineBuild ? '' : (providers.gradleProperty('MAXBALL_SERVER_URL').orElse(providers.environmentVariable('MAXBALL_SERVER_URL')).orElse(defaultServer).get().trim() ?: defaultServer)
if (gameServer && (!gameServer.startsWith('https://') || !(gameServer ==~ /https:\/\/[A-Za-z0-9.-]+(?::[0-9]+)?\/?/))) {
    throw new GradleException('MAXBALL_SERVER_URL deve ser a origem HTTPS do servidor, sem caminhos, chaves ou credenciais.')
}
android {
    namespace 'com.maxball.game'
    compileSdk 35
    defaultConfig {
        applicationId 'com.maxball.game'
        minSdk 26
        targetSdk 35
        versionCode 21
        versionName '1.0.20'
        buildConfigField 'String', 'SERVER_URL', '"' + gameServer + '"'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release { minifyEnabled false }
    }
}
